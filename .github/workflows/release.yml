# SPDX-License-Identifier: MPL-2.0
# Kris Jangle's release: built from source on GitHub by the shared FM-1 builder,
# with signed provenance, so the FM-1 Firmware Hub shows it as built from source.
# Layout: the app is kris-jangle/ in this repo (fm1-base itself), so app/build is
# kris-jangle/build and base/tools is ./tools. Lines marked "# <- yours":
#   - concurrency group and release title (Kris Jangle)
#   - pkg=kris-jangle (fm1.toml name lower case)
#   - the resource region asset (kris-jangle-*-res.bin alongside the package)
name: Build and attest firmware

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kris-jangle-release-${{ github.ref }}             # <- yours
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Prepare a draft without replacing a public release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: Kris Jangle                                # <- yours
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then exit 0; fi
          version=${GITHUB_REF_NAME#v}
          [[ "$version" =~ ^[0-9]{1,2}\.[0-9]{1,2}(\.[0-9]{1,2})?(-[A-Za-z0-9]+)?$ ]]
          flags=(--prerelease=false)
          if [[ "$version" == *-* ]]; then flags=(--prerelease --latest=false); fi
          if draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft); then
            [[ "$draft" == true ]] || { echo 'Refusing to rebuild a public release'; exit 1; }
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft \
              --title "$TITLE $version" --generate-notes "${flags[@]}"
          fi

  firmware:
    needs: prepare
    uses: zvenson/fm1-build/.github/workflows/build.yml@v1
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      sdk: true
      tests-block: true
      build: |
        set -euo pipefail
        pkg=kris-jangle                                     # <- yours
        git submodule update --init --recursive
        sudo apt-get install -y -qq libfribidi0
        python3 -c "from PIL import features; assert features.check('raqm'), 'Pillow without raqm'"
        test "$(git -C "$AC79_SDK" rev-parse HEAD)" = d179b4484759423312073f5fbb232501aa491047
        git clone -q https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
        git -C "$RUNNER_TEMP/emsdk" checkout -q a2b92777574c2feda07994cd4f1079a3dfc151f8
        "$RUNNER_TEMP/emsdk/emsdk" install 6.0.10
        "$RUNNER_TEMP/emsdk/emsdk" activate 6.0.10
        set +u; source "$RUNNER_TEMP/emsdk/emsdk_env.sh"; set -u
        emcc --version
        mkdir -p build/release-assets
        if [[ "$GITHUB_REF" == refs/tags/* ]]; then
          version=${GITHUB_REF_NAME#v}
          ./build.sh --release "$version"
          cp "kris-jangle/build/$pkg-$version.fwsc" build/release-assets/
          cp "kris-jangle/build/$pkg.bin" "build/release-assets/$pkg-$version-app.bin"
          cp "kris-jangle/build/$pkg-$version.fwsc" "kris-jangle/build/$pkg.fwsc"
          cp "kris-jangle/build/$pkg-$version-res.bin" build/release-assets/  # resource region, if built
          ./build.sh --rfm1 --release "$version"
          cp "kris-jangle/build/$pkg-$version.rfm1" build/release-assets/
        else
          ./build.sh
          cp "kris-jangle/build/$pkg.fwsc" build/release-assets/
          cp "kris-jangle/build/$pkg.bin" "build/release-assets/$pkg-app.bin"
          ./build.sh --rfm1
          cp kris-jangle/build/rfm1/"$pkg"-dev+*.rfm1 "build/release-assets/$pkg.rfm1"
        fi
        cp kris-jangle/build/firmware.json build/release-assets/
      test: |
        set -euo pipefail
        pkg=kris-jangle                                     # <- yours
        [ -f "kris-jangle/build/$pkg.fwsc" ]
        tools/build.py kris-jangle --host
        "kris-jangle/build/host/${pkg}_host" kris-jangle/tests/basic.txt kris-jangle/build/host
        node kris-jangle/tests/badge_test.mjs               # the badge page: the codes, the art, the offline cache
        sh tests/run_tests.sh
      packages: build/release-assets/*

  verify:
    needs: firmware
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      attestations: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: build/attested
      - name: Verify checksums and signed source provenance
        working-directory: build/attested
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha256sum --check SHA256SUMS
          for package in build/release-assets/*.fwsc build/release-assets/*-app.bin build/release-assets/*.rfm1 \
              build/release-assets/firmware.json; do
            gh attestation verify "$package" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow zvenson/fm1-build/.github/workflows/build.yml \
              --source-ref "$GITHUB_REF" --source-digest "$GITHUB_SHA"
          done
      - name: Publish the verified draft
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
