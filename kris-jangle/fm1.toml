# Kris Jangle's build settings (tools/build.py)
name = "KRIS-JANGLE"           # APP_NAME is in app.h; this names the build's files
title = "Kris Jangle"          # the name people see (firmware.json; else usb_manufacturer)
id_prefix = "FM-1_20"          # package identity: dev FM-1_2000, releases FM-1_20XXYYZZ
usb_manufacturer = "fm1-base"
usb_product = "KRIS JANGLE FM-1"
o2 = []                        # separate units compiled at -O2 (an app's DSP)
font_set = "terminus"          # the chunky pixel face (tools/gen_font.py's sets): Barlow, Terminus, Inter
words = "words.tsv"
backup = true
backup_ext = "ccb"
resources = "art/carol_res.bin"
resources_what = "Santa's intro, the Grump's jeer and lose sting, the reward jingle, and the CC0 piano/flute/sax samples (Versilian VCSL/VSCO-2 by Sam Gossner)"
ble = true                     # Bluetooth MIDI (--no-ble builds without it)
ble_stack = "own"              # Optimist's own Bluetooth stack (bt/), no JieLi library
ble_pairing = true             # pairing and an encrypted link (the bond kept)
# The site (tools/make_site.py, tools/publish_site.sh)
tagline = "a Christmas phrase game for the FM-1"
repo = "https://github.com/doohinkus/kris-jangle"
licence = "MPL-2.0"
credits = "Built on fm1-base (MPL-2.0). Carol melodies are traditional and in the public domain. The piano, flute and sax samples are CC0 1.0, from Sam Gossner's VCSL and VSCO-2 CE (Versilian Studios). The QR codes are made with Project Nayuki's QR Code generator library (MIT)."
author = "w33tSnx"
description = "Kris Jangle is a Christmas game for the FM-1: it plays the start of a carol and you replay it on the keys, on piano (or the selected sound), as the song builds three notes per level up to the whole song. Three misses sends you to Grump Mode, where the Grump jeers at you. Four carols: Jingle Bells, Deck the Halls, Ding Dong Merrily on High, and O Christmas Tree. For grown-ups, SELECT on the sound page turns on a music staff that writes the notes the demo plays and you play, off by default. A screen reader, and it runs in the browser emulator before you flash it."
tags = ["game", "synth", "fm"]
install = "https://doohinkus.github.io/kris-jangle/install/"
site = "https://doohinkus.github.io/kris-jangle/"
screenshot = "docs/img/screen-title.png"
