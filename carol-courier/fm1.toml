# Carol Courier's build settings (tools/build.py)
name = "CAROL-COURIER"         # APP_NAME is in app.h; this names the build's files
id_prefix = "FM-1_20"          # package identity: dev FM-1_2000, releases FM-1_20XXYYZZ
usb_manufacturer = "fm1-base"
usb_product = "CAROL COURIER FM-1"
o2 = []                        # separate units compiled at -O2 (an app's DSP)
words = "words.tsv"
backup = true
backup_ext = "ccb"
resources = "art/carol_res.bin"
resources_what = "Santa's intro, the Grump's jeer and lose sting, the reward jingle, and the Verse One piano sample (CC0, Versilian VCSL by Sam Gossner)"
ble = true                     # Bluetooth MIDI (--no-ble builds without it)
ble_stack = "own"              # Optimist's own Bluetooth stack (bt/), no JieLi library
ble_pairing = true             # pairing and an encrypted link (the bond kept)
# The site (tools/make_site.py, tools/publish_site.sh)
tagline = "a Christmas phrase game for the FM-1"
repo = "https://github.com/charlesvestal/fm1-base"
licence = "MPL-2.0"
credits = "Built on fm1-base (MPL-2.0). Carol melodies are traditional and in the public domain. The piano sample is CC0 1.0, from Sam Gossner's VCSL (Versilian Studios)."
author = "Charles Vestal"
description = "Carol Courier is a Christmas game for the FM-1: it plays the start of a carol and you replay it on the keys, on piano throughout, as the song builds three notes per level up to the whole song. Three misses sends you to Grump Mode, where the Grump jeers at you, and a clean level earns a word-pair Carol Code you can text to a friend to beat your score. Three carols, a screen reader, and it runs in the browser emulator before you flash it."
tags = ["game", "synth", "fm"]
install = "https://charlesvestal.github.io/fm1-base/install/"
site = "https://charlesvestal.github.io/fm1-base/"
screenshot = "docs/img/screen-title.png"
