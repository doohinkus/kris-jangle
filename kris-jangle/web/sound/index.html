<!-- Kris Jangle's badge page: the FM-1's QR code opens it with the carol and
     the level in the address (?c=0&l=5). It shows the badge — on the ice
     card — and can share one.

     The page is the reference's own world: its indigo-to-pink sky, its ice
     card with the green seal, its snowflake stars, and the game's own
     characters on the card. The headings are drawn as images by
     art/gen_page_art.py, the way the device draws them; the carol's name and
     the level are the page's own text, in Barlow, the site's face.
     It is read on a phone, in either hand, so the layout is written for both
     orientations. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kris Jangle &mdash; your badge</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="art/title.png">
<link rel="apple-touch-icon" href="art/icon-192.png">
<meta name="theme-color" content="#071f4f">
<meta name="description" content="Your Kris Jangle badge: the level you cleared, on your phone.">
<style>
/* Barlow Semi Condensed, the rest of the site's face, self-hosted: the page
   works offline, so a Google Fonts link would break that. These are subsets
   of assets/fonts/BarlowSemiCondensed-{Medium,Bold}.ttf (SIL OFL 1.1). */
@font-face {
  font-family: "Barlow Semi Condensed";
  font-weight: 400; font-style: normal; font-display: swap;
  src: url("barlow-medium.woff2") format("woff2");
}
@font-face {
  font-family: "Barlow Semi Condensed";
  font-weight: 600 700; font-style: normal; font-display: swap;
  src: url("barlow-bold.woff2") format("woff2");
}

/* The reference's own sky, sampled off it: indigo down to rose, a smooth
   fall the whole way — not the device's ten hard bands, because this page is
   the badge's picture, not the device's screen. */
:root {
  --sky-1: #071f4f; --sky-2: #0c255d; --sky-3: #112965; --sky-4: #1a3173;
  --sky-5: #2b3a88; --sky-6: #374193; --sky-7: #584c98; --sky-8: #77559a;
  --sky-9: #865999; --sky-10: #9f6497; --sky-11: #bd6f8e;
  --panel: #0a0e26;
  --snow: #f4f0f6;
  --frost: #b0d6f0;
  --gold: #ffc83c;
  --ink: #0a0e26;
  --card-ink: #0e2255;        /* the ink on the card's paper, off the reference */
  --ice: #7ebee8;
  --ice-deep: #3664aa;
  --edge: #2c3a6e;
}
* { box-sizing: border-box; }
html { background: var(--sky-1); }
body {
  margin: 0;
  padding: 0;
  min-height: 100vh;
  min-height: 100dvh;
  color: var(--snow);
  font-family: "Barlow Semi Condensed", "Helvetica Neue", Arial, sans-serif;
  text-align: center;
  overflow-x: hidden;
}
.sky {
  position: fixed;
  inset: 0;
  z-index: -2;
  background: linear-gradient(to bottom,
      var(--sky-1) 0%, var(--sky-2) 10%, var(--sky-3) 20%, var(--sky-4) 30%,
      var(--sky-5) 40%, var(--sky-6) 50%, var(--sky-7) 60%, var(--sky-8) 70%,
      var(--sky-9) 80%, var(--sky-10) 90%, var(--sky-11) 100%);
}
/* The stars: the reference's plus signs, with a sparkle among them. */
.stars { position: fixed; inset: 0; z-index: -1; pointer-events: none; }
.stars i {
  position: absolute; background: center / contain no-repeat;
  animation: twinkle 4s steps(1) infinite;
}
.stars i.plus { background-image: url("art/plus.png"); }
.stars i.star4 { background-image: url("art/sparkle.png"); }
@keyframes twinkle { 0%, 60% { opacity: 1; } 61%, 100% { opacity: .25; } }

/* The pixel art is drawn at two image pixels for every CSS pixel and shown
   at its natural size, so the pixels stay square. The card is the one
   exception: it is a drawing, not pixel art, and it halves to fit the page,
   so it scales smooth. */
img { image-rendering: pixelated; display: block; }
img.card { image-rendering: auto; }
h1, h2 { margin: 0; }
p { margin: 0; }
.hidden { display: none !important; }

.page {
  max-width: 460px;
  margin: 0 auto;
  padding: calc(env(safe-area-inset-top) + 10px) 12px
           calc(env(safe-area-inset-bottom) + 48px);
}

/* The title: the game's name in the reference's white and blue, and the rule
   under it. */
.top { margin: 0 auto; }
.banner { margin: 2px auto 4px; }
.divider { margin: 0 auto 10px; opacity: .85; }

/* A heading: the game's face, drawn as an image (art/gen_page_art.py). */
.head { margin: 14px auto 8px; }

/* The badge: the reference's ice card, the seal baked into it. The contents
   are placed in the plaque's own pixels, so the whole thing is one piece.

   The places are set here, once, as custom properties: the page puts the
   parts where these say, and app.js reads the same numbers back to draw the
   share image, so the two cannot drift apart. */
.plaquewrap { position: relative; margin: 0 auto; width: 340px; max-width: 100%; }
.plaque {
  position: relative; width: 340px; height: 364px; margin: 0 auto;
  transform-origin: top left;
  --name-top: 67px;  --name-size: 19px;
  --num-top: 100px;  --num-size: 52px;
  --lvlword-top: 157px;
  --who-left: 48px;  --who-top: 165px;
  --grump-left: 219px; --grump-top: 78px;
  --row-gap: 8px;
}
/* On a phone narrower than the card, the whole badge scales down as one, so
   its pixels stay square. The scale is set from app.js, which knows the
   width the phone has. */
.plaque.scaled { transform: scale(var(--ps, 1)); }
.plaque img.plaquebg { position: absolute; inset: 0; width: 340px; height: 364px; }
/* A row across the card: the text in the middle, an ornament each side. */
.plaque .row {
  position: absolute; left: 0; right: 0;
  display: flex; align-items: center; justify-content: center;
  gap: var(--row-gap);
}
.plaque .row-name { top: var(--name-top); height: 24px; }
.plaque .row-num { top: var(--num-top); height: var(--num-size); }
.plaque .row img { flex: none; }
#badge-name {
  font: 700 var(--name-size)/1 "Barlow Semi Condensed", "Helvetica Neue", Arial, sans-serif;
  color: var(--card-ink); letter-spacing: .02em; white-space: nowrap;
}
#badge-num {
  font: 700 var(--num-size)/var(--num-size) "Barlow Semi Condensed", "Helvetica Neue", Arial, sans-serif;
  color: var(--card-ink);
}
.plaque .lvlword {
  position: absolute; left: 50%; top: var(--lvlword-top); transform: translateX(-50%);
}
.plaque .who {
  position: absolute; left: var(--who-left); top: var(--who-top);
}
.plaque .grump {
  position: absolute; left: var(--grump-left); top: var(--grump-top);
  transform: scaleX(-1);
}

/* The eleven level pips: the levels this carol has been taken to. */
.pips { display: flex; gap: 3px; justify-content: center; margin: 14px auto 0; }
.pips i {
  width: 11px; height: 11px; background: rgba(255,255,255,.16);
  border: 1px solid rgba(255,255,255,.34);
}
.pips i.on { background: var(--gold); border-color: var(--gold); }

.congrats-line {
  margin: 14px auto 4px; max-width: 34ch;
  font-size: 15px; line-height: 1.45; color: var(--snow);
  /* the halo: the line can fall on the rose end of the sky, where white
     alone would not read */
  text-shadow: 0 1px 0 #14142e, 0 0 3px rgba(16, 14, 40, .95),
               0 0 8px rgba(16, 14, 40, .75);
}
.congrats-line b { color: var(--gold); font-weight: 700; }

/* The notes are on the game's own panel: a dark blue glass over the sky, with
   a white border, the way the device draws its boxes. */
.note {
  margin: 10px auto 0; max-width: 36ch;
  font-size: 12.5px; line-height: 1.5; color: var(--snow);
  background: rgba(10, 14, 38, .84);
  border: 2px solid rgba(255, 255, 255, .82);
  padding: 9px 12px;
}

/* The buttons: the game's boxes, in Barlow, with a pixel border. */
.btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 14px; }
button, .btn {
  font: 600 14px/1 "Barlow Semi Condensed", "Helvetica Neue", Arial, sans-serif;
  letter-spacing: .08em; text-transform: uppercase;
  color: var(--snow); background: rgba(10,14,38,.82);
  border: 2px solid var(--edge); border-radius: 0;
  padding: 12px 16px; min-height: 44px; cursor: pointer;
  box-shadow: 0 2px 0 rgba(0,0,0,.35);
}
button:active, .btn:active { background: #1b2a5e; transform: translateY(1px); box-shadow: none; }
button:focus-visible, .btn:focus-visible, a:focus-visible {
  outline: 3px solid var(--gold); outline-offset: 2px;
}
button:disabled { opacity: .45; cursor: default; }
button[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); }

.picker { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
.picker select {
  font: inherit; font-size: 14px; width: 100%; padding: 10px; min-height: 44px;
  background: rgba(10,14,38,.82); color: var(--snow);
  border: 2px solid var(--edge); border-radius: 0;
}

.footer {
  margin-top: 22px; font-size: 12.5px;
  background: rgba(10, 14, 38, .84);
  border: 2px solid rgba(255, 255, 255, .82);
  padding: 9px 12px;
  display: inline-block;
}
.footer a { color: var(--frost); }
.credit { font-size: 11px; margin-top: 8px; }
.sr {
  position: absolute; width: 1px; height: 1px; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap;
}

/* The phone is held either way round. In landscape the badge and the notes
   stand side by side, and the page itself does not scroll. */
@media (orientation: landscape) and (max-height: 620px) {
  .page {
    max-width: none; height: 100dvh; padding-bottom: env(safe-area-inset-bottom);
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    grid-template-rows: auto minmax(0, 1fr) auto;
    grid-template-areas:
      "top   side"
      "badge side"
      "foot  side";
    gap: 0 20px; align-items: start;
    overflow: hidden;
  }
  .top { grid-area: top; }
  .banner { margin: 0 auto 2px; }
  .divider { margin: 0 auto 4px; }
  #badge-section { grid-area: badge; min-height: 0; overflow-y: auto; }
  #side-section { grid-area: side; min-height: 0; overflow-y: auto; }
  .footer { grid-area: foot; margin-top: 4px; }
  .credit { display: none; }             /* the licence is on the site's page */
  .head { display: none; }              /* the card says what it is */
  /* The card, scaled down as one: half size, beside the notes. */
  .plaquewrap { width: 170px; height: 182px; }
  .plaque { width: 340px; height: 364px; transform: scale(.5); transform-origin: top left; }
  .pips { margin-top: 6px; gap: 2px; }
  .pips i { width: 8px; height: 8px; }
  .congrats-line { font-size: 13px; margin: 8px auto 2px; }
  .note { font-size: 11px; margin-top: 6px; padding: 7px 10px; }
  .btns { margin-top: 8px; gap: 6px; }
  button, .btn { font-size: 12px; padding: 9px 11px; min-height: 40px; }
}
@media (prefers-reduced-motion: reduce) {
  .stars i { animation: none; }
}
</style>
</head>
<body>
<div class="sky"></div>
<div class="stars" id="stars" aria-hidden="true"></div>

<div class="page">
  <header class="top">
    <img class="banner" src="art/title_page.png" alt="Kris Jangle" width="184" height="38">
    <img class="divider" src="art/divider.png" alt="" width="240" height="24">
  </header>

  <section id="badge-section">
    <img class="head" src="art/head_badge.png" alt="Your badge" width="168" height="38">

    <div id="badge-card" class="hidden">
      <div class="plaquewrap">
        <div class="plaque">
          <img class="plaquebg card" src="art/card.png" alt="" width="340" height="364">
          <div class="row row-name">
            <img src="art/orn_flake.png" alt="" width="22" height="22">
            <span id="badge-name">Merrily on High</span>
            <img src="art/orn_flake.png" alt="" width="22" height="22">
          </div>
          <div class="row row-num">
            <img src="art/orn_spark.png" alt="" width="14" height="14">
            <span id="badge-num">11</span>
            <img src="art/orn_spark.png" alt="" width="14" height="14">
          </div>
          <img class="lvlword" src="art/head_level.png" alt="Level" width="88" height="38">
          <img id="badge-who" class="who" src="art/frosty1.png" alt="Frosty" width="84" height="124">
          <img class="grump" src="art/grump.png" alt="The Grump" width="84" height="124">
        </div>
      </div>
      <div class="pips" id="pips" aria-hidden="true"></div>
    </div>

    <div id="picker-card" class="hidden">
      <p class="note" style="margin-top:0">No badge in the address. Pick one:</p>
      <div class="picker">
        <select id="pick-carol" aria-label="Carol"></select>
        <select id="pick-level" aria-label="Level"></select>
      </div>
      <div class="btns"><button id="pick-go" type="button">Show</button></div>
    </div>
  </section>

  <section id="side-section" class="hidden">
    <p class="congrats-line" id="congrats"></p>
    <div class="btns">
      <button id="share" type="button">Share</button>
      <button id="download" type="button">Save</button>
      <button id="sound" type="button" aria-pressed="false">Sound</button>
      <button id="speak" type="button" aria-pressed="true">Hear it</button>
    </div>
    <p class="note" id="badge-note">Scanned from an FM-1. The sound link will make badges
      verified later; this one is a challenge until then.</p>
  </section>

  <p class="footer"><a href="../">Kris Jangle on the FM-1</a></p>
  <p class="note credit">Fonts: Barlow Semi Condensed (SIL OFL 1.1).</p>
</div>

<script src="app.js"></script>
</body>
</html>
